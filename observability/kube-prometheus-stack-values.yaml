# kube-prometheus-stack 91.7.0 (Prometheus Operator v0.94.1) for the local lab (minikube/kind).
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --version 91.7.0 -n monitoring --create-namespace -f observability/kube-prometheus-stack-values.yaml
# The release name MUST stay "kube-prometheus-stack": ServiceMonitor/Probe/PrometheusRule
# objects are selected by the label release=kube-prometheus-stack.

prometheus:
  prometheusSpec:
    retention: 15d            # Day 4 NFR: 15 days
    retentionSize: 8GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:                # Day 4 NFR: limits on the Prometheus pod
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "1", memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    # Secret created out of band (never in Git):
    #   kubectl -n monitoring create secret generic alertmanager-slack --from-literal=webhook='https://hooks.slack.com/services/...'
    secrets: [alertmanager-slack]
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-alerts
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Silence the always-firing Watchdog heartbeat; keep InsightHub alerts.
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        # Critical first, shorter repeat (custom routing per severity).
        - receiver: slack-alerts
          matchers: ['severity = "critical"']
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: slack-alerts
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook
            channel: "#alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              namespace={{ .Labels.namespace }} component={{ .Labels.component }} startsAt={{ .StartsAt }}
              runbook: {{ .Annotations.runbook_url }}
              {{ end }}

grafana:
  adminPassword: insighthub-local   # local lab only; port-forward, never exposed
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 1Gi}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

# Control-plane components are not scrapeable on minikube/kind; disabling them keeps
# "every expected target UP" true instead of permanent DOWN targets.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
