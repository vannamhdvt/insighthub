{{- $root := . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-api
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "insighthub.checkovWorkload" . | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "insighthub.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insighthub.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "insighthub.podSecurityContext" (dict) | nindent 8 }}
      initContainers:
        {{- include "insighthub.waitForSchema" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "insighthub.image" .Values.images.api }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "insighthub.fullname" . }}-config
          env:
            {{- include "insighthub.secretEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- include "insighthub.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.config.UPLOAD_DIR }}
            - name: tmp
              mountPath: /tmp
            {{- include "insighthub.csiMount" . | nindent 12 }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "insighthub.fullname" . }}-uploads
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- include "insighthub.csiVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-api
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "insighthub.checkovNamespace" . | nindent 4 }}
spec:
  selector:
    {{- include "insighthub.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "insighthub.fullname" . }}-api
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    {{- include "insighthub.checkovNamespace" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "insighthub.fullname" . }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
{{- end }}
