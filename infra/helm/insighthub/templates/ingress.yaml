{{- if .Values.ingress.enabled }}
{{- $name := include "insighthub.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    {{- include "insighthub.checkovNamespace" . | nindent 4 }}
    nginx.ingress.kubernetes.io/proxy-body-size: "11m"
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/issuer: {{ $name }}-{{ .Values.ingress.tls.issuer }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ $name }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Public API contract used by the smoke test; everything else is the web UI.
          {{- range list "/healthz" "/readyz" "/documents" "/chat" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-api
                port: {name: http}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-web
                port: {name: http}
{{- if .Values.ingress.tls.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $name }}-{{ .Values.ingress.tls.issuer }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    {{- include "insighthub.checkovNamespace" . | nindent 4 }}
spec:
  {{- if eq .Values.ingress.tls.issuer "letsencrypt" }}
  acme:
    server: {{ .Values.ingress.tls.acmeServer }}
    email: {{ required "ingress.tls.acmeEmail is required for letsencrypt" .Values.ingress.tls.acmeEmail | quote }}
    privateKeySecretRef:
      name: {{ $name }}-acme-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className }}
  {{- else }}
  selfSigned: {}
  {{- end }}
{{- end }}
{{- end }}
