{{- if and (eq .Values.runtimeSecret.source "aws") (not .Values.localDependencies.enabled) }}
# Reads the Terraform-managed secret with the pod's IRSA role and syncs the two
# keys into a Kubernetes Secret consumed as env vars.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "insighthub.fullname" . }}-runtime
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    {{- include "insighthub.checkovNamespace" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.runtimeSecret.aws.region | quote }}
    objects: |
      - objectName: {{ .Values.runtimeSecret.aws.secretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: database_url
            objectAlias: database_url
          - path: redis_url
            objectAlias: redis_url
  secretObjects:
    - secretName: {{ .Values.runtimeSecret.name }}
      type: Opaque
      data:
        - objectName: database_url
          key: DATABASE_URL
        - objectName: redis_url
          key: REDIS_URL
{{- end }}
