# LiteLLM gateway (v1.103.0) for InsightHub Day 6.
# Every LLM call of the 3 workloads goes through here with its own virtual key:
#   insighthub  -> insighthub-chat, insighthub-embed   (InsightHub API/worker)
#   chatops-bot -> chatops-agent                       (Slack bot LLM tool loop)
#   coding      -> coding-review                       (coding workflow client)
# Provider credentials exist only in this pod (Secret litellm-secrets).
# Prices are set explicitly (Gemini paid-tier list price, checked 2026-09-28 at
# ai.google.dev/gemini-api/docs/pricing) so spend/budget is deterministic even on free tier.

model_list:
  - model_name: insighthub-chat
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.0000015
      max_tokens: 512
  # Fallback when Gemini is rate limited/unavailable: local model on the Mac (Ollama).
  # Guardrails still run (they are gateway hooks, independent of the upstream model).
  - model_name: insighthub-chat-local
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct
      api_base: os.environ/OLLAMA_BASE_URL
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: chatops-agent
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.0000015
  - model_name: coding-review
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.0000015
  - model_name: insighthub-embed
    litellm_params:
      model: ollama/mxbai-embed-large
      api_base: os.environ/OLLAMA_BASE_URL
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      mode: embedding

router_settings:
  fallbacks:
    - insighthub-chat: [insighthub-chat-local]
  num_retries: 1
  timeout: 60

litellm_settings:
  drop_params: true
  request_timeout: 60
  callbacks: ["prometheus"]
  # /metrics has no prompt data, only counters by key alias/model. Access is limited
  # by NetworkPolicy (monitoring namespace) instead of putting the master key into
  # the Prometheus scrape config.
  require_auth_for_metrics_endpoint: false
  # Spend logs keep metadata/tags but not message bodies (no prompt/PII at rest).
  turn_off_message_logging: true

guardrails:
  - guardrail_name: insighthub-guardrail
    litellm_params:
      guardrail: insighthub_guardrail.InsightHubGuardrail
      mode: [pre_call, post_call]
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  # Budget/spend correctness needs Postgres (not SQLite); keys live in the DB.
  disable_spend_logs: false
  # Flush spend to DB quickly so budget checks see recent spend.
  proxy_batch_write_at: 5
