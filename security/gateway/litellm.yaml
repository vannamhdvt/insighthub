apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels: {app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: insighthub}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: litellm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: litellm, app.kubernetes.io/part-of: insighthub}
    spec:
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.0@sha256:bd089afdcd35b894b14a93f9743cdc8b591f82da1a38dd43a010a7b0c9de5fd7
          args: ["--config", "/app/config/config.yaml", "--port", "4000", "--num_workers", "1"]
          envFrom:
            - secretRef: {name: litellm-secrets}
          env:
            - {name: GUARDRAIL_MODE, value: enforce}
            - {name: LLAMA_GUARD_ENABLED, value: "true"}
            - {name: LLAMA_GUARD_MODEL, value: "llama-guard3:1b"}
            - {name: LLAMA_GUARD_FAIL, value: closed}
            - {name: LLAMA_GUARD_TIMEOUT, value: "30"}
            - {name: LLAMA_GUARD_KEEP_ALIVE, value: "60m"}
            - {name: OLLAMA_BASE_URL, value: "http://host.minikube.internal:11434"}
            - {name: LITELLM_LOG, value: WARNING}
          ports: [{name: http, containerPort: 4000}]
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: litellm-config}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels: {app.kubernetes.io/name: litellm}
spec:
  selector: {app.kubernetes.io/name: litellm}
  ports: [{name: http, port: 4000, targetPort: http}]
