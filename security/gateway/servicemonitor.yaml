apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  labels: {release: kube-prometheus-stack, app.kubernetes.io/part-of: insighthub}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: litellm}
  endpoints:
    - port: http
      path: /metrics/
      interval: 30s
